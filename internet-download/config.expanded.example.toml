# Expanded Common Crawl example.
# This keeps the 105 enabled domains in sites.csv and adds the explicit
# international-data, open-data, scientific, and developer targets below.
# max_records_per_target keeps the example bounded even when a source has a
# larger budget in sites.csv.
[commoncrawl]
crawl = "CC-MAIN-2026-17"
output = "data/commoncrawl-expanded"
workers = 8
max_total_bytes = 53687091200
targets_file = "sites.csv"
max_records_per_target = 500
contact_email = "concurrentsquared@concurrentsquared.com"
index_threads = 4
# Shared global ceiling across all WARC workers; transport connections are pooled.
download_request_rate_per_second = 8.0

[search]
documents = "data/commoncrawl-expanded/documents.jsonl"
dataset_documents = "data/commoncrawl-expanded/datasets.jsonl"
overlay_documents = "data/commoncrawl-expanded/overlay.jsonl"
overlay_database = "../kiwix-overlay/data/overlay.db"
database = "data/commoncrawl-expanded/search.sqlite3"
max_chars_per_document = 250000
dataset_rows_per_document = 100
kiwix_url = "http://127.0.0.1:8090"

# International organizations and statistical portals.
