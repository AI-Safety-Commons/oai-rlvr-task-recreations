[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-download"
version = "0.1.0"
description = "Build a bounded offline-internet corpus from public archives"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "urllib3>=2.2,<3", "Flask>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
internet-download = "internet_download.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
