services:
  kiwix-overlay:
    build: .
    init: true
    ports:
      - "${OVERLAY_HOST_PORT:-3010}:80"
    environment:
      KIWIX_URL: "${KIWIX_URL:-http://kiwix:8080}"
      OVERLAY_PORT: "80"
      KIWIX_BOOK: "${KIWIX_BOOK:-wikipedia_en_all_maxi}"
      KIWIX_ARTICLE_TEMPLATE: "${KIWIX_ARTICLE_TEMPLATE:-/content/{book}/{title}}"
      OVERLAY_SECRET: "${OVERLAY_SECRET:-airgapped-development-only}"
    volumes:
      - "${OVERLAY_DATA_DIR:-./data}:/data"
    networks:
      coordination:
        aliases: [kiwix-overlay]
    restart: unless-stopped

networks:
  coordination:
    external: true
    name: ${COORDINATION_NETWORK:-ffqb-shared}
