{% extends "base.html" %}{% block content %}
<h1>Editing {{ title }}</h1>
<p class="help">Edit the article body as HTML. Scripts are not required or supported by this interface.</p>
{% if error %}<div class="error"><strong>Error:</strong> {{ error }}</div>{% endif %}
<form method="post" class="edit-form">
  <label for="html"><strong>Article HTML</strong></label>
  <textarea id="html" name="html" rows="28" spellcheck="false" required>{{ source }}</textarea>
  <label for="summary"><strong>Edit summary</strong> <span class="muted">(briefly describe your change)</span></label>
  <input id="summary" name="summary" maxlength="200" placeholder="Corrected a date">
  <div><button class="primary" type="submit">Save changes</button> <a href="{{ url_for('article', book=book, title=encoded_title) }}">Cancel</a></div>
</form>
{% endblock %}
